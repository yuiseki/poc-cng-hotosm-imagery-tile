apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hotosm-imagery-tile
  namespace: knative-pool
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containerConcurrency: 5
      timeoutSeconds: 120
      containers:
        - image: hotosm-imagery-tile:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: STAC_API_URL
              value: "https://api.imagery.hotosm.org/stac"
            - name: STAC_ASSET_KEY
              value: "visual"
            - name: STAC_SEARCH_LIMIT
              value: "50"
            - name: TILE_FORMAT
              value: "PNG"
            - name: TILE_SIZE
              value: "512"
            - name: GDAL_DISABLE_READDIR_ON_OPEN
              value: "EMPTY_DIR"
            - name: GDAL_HTTP_MERGE_CONSECUTIVE_RANGES
              value: "YES"
            - name: VSI_CACHE
              value: "TRUE"
            - name: VSI_CACHE_SIZE
              value: "536870912"
            - name: CPL_VSIL_CURL_ALLOWED_EXTENSIONS
              value: ".tif,.TIF,.tiff,.TIFF"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
